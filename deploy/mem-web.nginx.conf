# Replace mem.example.org and certificate paths before enabling this site.
# mem serve must listen only on 127.0.0.1:8765, with the exact HTTPS public_origin.
server {
    listen 80;
    server_name mem.example.org;
    return 308 https://mem.example.org$request_uri;
}

server {
    listen 443 ssl;
    server_name mem.example.org;
    ssl_certificate /etc/letsencrypt/live/mem.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mem.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Portable database import allows 2 GiB; ordinary uploads are bounded by Go.
    client_max_body_size 2g;
    client_body_timeout 120s;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        # Preserve the submitted host; the application rejects unknown hosts.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
