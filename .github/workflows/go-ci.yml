name: Go CI

on:
  push:
    branches:
      - master
      - "codex/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./... -count=1 -timeout=120s

      - name: Run vet
        run: go vet ./...

      - name: Build commands
        run: go build ./cmd/mem ./cmd/mem-bot ./cmd/mem-index

  quality:
    name: Whitespace and race
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check whitespace
        shell: bash
        run: |
          empty_tree="$(git hash-object -t tree /dev/null)"
          git diff --check "$empty_tree" HEAD

      - name: Run race detector
        run: go test -race ./... -count=1 -timeout=180s
